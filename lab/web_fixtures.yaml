    Loss adjusters. Ashgrove Adjusting Limited, national coverage, all classes.
    Kelverton Adjusting, commercial property and business interruption only.

    Restoration and drying. Redwell Restoration Services Limited, national.
    Brayford Damage Management, southern region only.

    Motor repair. Bramfield Motor Works Limited, approved for all makes.
    Ostlermill Accident Repair, approved for light commercial vehicles.

    Solicitors, defendant. Harrowgate and Speed LLP, motor and liability.
    Venn Latimer LLP, professional indemnity and commercial disputes.

    Forensic accountants. Aldbury Forensic, business interruption quantum.

    Structural engineers. Penhale Consulting, subsidence and structural
