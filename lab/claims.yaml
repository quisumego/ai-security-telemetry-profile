# Thornfield Mutual claims table
#
# The structured record behind the lookup_claim tool. Twelve claims, ten
# belonging to Thornfield Mutual and two to Pearson Hardman Underwriting, the
# second tenant on the shared platform.
#
# Every name, reference, policy number and figure here is invented for this lab.
# No real person, company, policy or claim is described. The claim references
# used in lab/corpus/ correspond to the records below, so a session that
# retrieves a document and then looks up the claim it names finds a consistent
# story rather than a dead end.
#
# This file sits outside lab/corpus/ because it is a structured lookup rather
# than a retrievable document. The retrieval index never reads it. It is frozen
# alongside the corpus.

