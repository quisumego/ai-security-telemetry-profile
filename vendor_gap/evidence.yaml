# The vendor gap evidence: every source, every quotation, every verdict.
#
# This file is the source of truth for docs/vendor-gap-analysis.md and
# results/vendor-gap.json, ruled at M7 on 23 September 2026 (ruling 14). Every
# page below was read in the M7 session on its retrieval date, from the page's
# own text. Nothing here is from memory, and no vendor's behaviour is inferred
# from the other's. tests/test_vendor_gap.py holds every verdict to a listed
# source.
#
# How the lab is placed on a vendor. The lab agent runs on the Claude Agent SDK
# against Anthropic's API, not on either vendor. The question is hypothetical:
# had the same agent's model calls gone through the vendor's model layer, or had
# the same agent been hosted on the vendor's agent layer, what would the
# vendor's own records carry. In the lab, tools and retrieval run in the
# application (lab/tools/__init__.py), so a vendor sees them only as far as they
# pass through a model request or response, or through a record the deployment
# itself supplies.
#
# Row keys, one row per field and per event type, on every surface:
#   v:       verdict. D available by default, C available with configuration,
#            A absent, U unconfirmed (vendor_gap/rulings.py, ruling 3).
#   form:    own (own field, the default), body (inside a request or response
#            body), content (in free content only, because the application
#            wrote it there), caller (caller-supplied, or held only by the
#            deployment), derived (the deployment derives it). Rulings 6 and 7.
#   path:    for form body only. "undocumented" where the pages place the value
#            in a body but document no path to it inside the logged body.
#   partial: the documented difference in meaning from the register (ruling 9).
#   setting: for v C, the setting that makes it available (ruling 4).
#   src:     source numbers. For v U, the pages attempted.
#   note:    why, in one or two lines.
#
# A row with v A and a form of caller or derived is absent under vendor
# defaults because the vendor does not produce the value itself (ruling 7).
# Any other v A needs a full field list, or for an event type a full list of
# record kinds, declared on its surface (ruling 3).

