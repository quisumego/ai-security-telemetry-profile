surfaces:

  # ================================================================= Azure ==
  - id: azure-as-shipped
    vendor: azure
    layer: as_shipped
    name: Activity log and platform metrics
    switch: none; both are collected with no action
    switch_src: [3]
    switch_quotes: [az-auto-collected]
    records: >-
      Activity log entries for management operations performed through
      Resource Manager, and platform metrics as numeric series split by
      dimensions such as the model deployment and model name. Agent metrics,
      including tool calls split by tool name, are series too.
    records_src: [6, 7, 2, 13]
    full_field_list: null
    full_field_list_note: >-
      The activity log's properties member is an open dictionary, so no page
      gives an entry's full field list.
    full_record_kinds:
      src: [7]
      quotes: [az-activity-scope, az-activity-admin]
    fields:
      session.id:                    {v: A, form: caller, src: [7], note: "The lab's session identifier exists only in the lab; no page names a way to send it."}
      session.start_time:            {v: A, form: derived, src: [7], note: "Derivable from a session's first record, which needs a session key the surface lacks."}
      session.user_id:               {v: U, src: [6, 7], partial: "the caller of a management operation, not the end user of a session", note: "An entry's caller would identify the principal if model calls were recorded, which the pages do not settle."}
      session.tenant_id:             {v: A, form: caller, src: [7], note: "The deployment's own tenancy model; the vendor cannot know it."}
      session.client_app:            {v: A, form: caller, src: [7], note: "Held only by the deployment."}
      session.agent_id:              {v: A, form: caller, src: [7], note: "Held only by the deployment."}
      session.config_version:        {v: A, form: caller, src: [7], note: "Held only by the deployment."}
      turn.index:                    {v: A, form: derived, src: [7], note: "Derivable from record order within a session, which needs a session key."}
      turn.timestamp:                {v: U, src: [6, 7], note: "An entry carries eventTimestamp, but whether a model call is recorded at all is not settled."}
      turn.model_id:                 {v: U, src: [6, 7, 2], note: "Metrics split by model name, but a metric is a series, not a per-call value; no entry field names the model."}
      turn.model_version:            {v: U, src: [6, 7, 2], note: "As turn.model_id."}
      turn.tokens_in:                {v: U, src: [2, 7], note: "Token metrics are series split by deployment and model, not per-call values; an entry's open properties could carry one, which no page settles."}
      turn.tokens_out:               {v: U, src: [2, 7], note: "As turn.tokens_in."}
      turn.latency:                  {v: U, src: [2, 7], note: "Latency metrics are series, not per-call values."}
      turn.finish_reason:            {v: U, src: [7], note: "Not a named entry field; the open properties member is not documented for these operations."}
      content.prompt_text:           {v: U, src: [7], note: "httpRequest names the client request identifier, IP address and method; no page says a body is recorded."}
      content.prompt_hash:           {v: A, form: derived, src: [7], note: "A hash the deployment computes from text."}
      content.response_text:         {v: U, src: [7], note: "Not a named entry field."}
      content.response_hash:         {v: A, form: derived, src: [7], note: "A hash the deployment computes from text."}
      content.system_prompt_version: {v: A, form: caller, src: [7], note: "Held only by the deployment."}
      content.redaction_applied:     {v: A, form: caller, src: [7], note: "Held only by the deployment."}
      retrieval.document_ids:        {v: U, form: content, src: [7], note: "Identifiers reach the vendor only inside tool results the application writes, and whether a model call is recorded at all is not settled."}
      retrieval.chunk_ids:           {v: U, form: content, src: [7], note: "As retrieval.document_ids."}
      retrieval.scores:              {v: A, form: caller, src: [7], note: "The lab's search tool does not return scores to the model; they stay in the application."}
      retrieval.query_text:          {v: U, src: [7], note: "Would sit in the model's tool call, which no named entry field carries."}
      retrieval.source_provenance:   {v: A, form: derived, src: [7], note: "Derivable from document identifiers and the deployment's own provenance labels."}
      retrieval.permission_context:  {v: A, form: derived, src: [7], note: "Needs the caller's scope and each document's scope, which only the deployment holds."}
      action.tool_name:              {v: U, src: [7], note: "Would sit in the model's response, which no named entry field carries."}
      action.tool_arguments:         {v: U, src: [7], note: "As action.tool_name."}
      action.result_hash:            {v: A, form: derived, src: [7], note: "Derivable from a tool result, which the application produces."}
      action.result_bytes:           {v: A, form: derived, src: [7], note: "As action.result_hash."}
      action.permission_decision:    {v: A, form: caller, src: [7], note: "The lab's own authorisation decision, made in its hook."}
      action.egress_target:          {v: A, form: derived, src: [7], note: "Derivable by normalising tool arguments."}
      action.context_document_ids:   {v: A, form: derived, src: [7], note: "Derivable from the documents retrieved earlier in a session."}
      control.canary_triggered:      {v: A, form: derived, src: [7], note: "Needs the deployment's canary register and the text or arguments the value would appear in."}
      control.policy_version:        {v: A, form: caller, src: [7], note: "Held only by the deployment."}
      control.block_reason:          {v: A, form: caller, src: [7], note: "The lab's own guardrail; a vendor control is a different thing."}
    events:
      session_start:                 {v: A, src: [6, 7], note: "A session boundary in the application is not an operation performed through Resource Manager."}
      turn:                          {v: U, src: [6, 7], note: "The pages do not say whether a model call is recorded as an action operation."}
      retrieval:                     {v: A, src: [6, 7], note: "Retrieval runs in the application and calls no Azure API."}
      tool_pre:                      {v: A, src: [6, 7], note: "The lab's tools run in the application and call no Azure API."}
      tool_post:                     {v: A, src: [6, 7], note: "As tool_pre."}
      session_end:                   {v: A, src: [6, 7], note: "As session_start."}

  - id: azure-model
    vendor: azure
    layer: model
    name: Foundry resource logs through a diagnostic setting
    switch: >-
      create a diagnostic setting on the Foundry resource with the categories
      the how-to lists: Audit Logs, Request and Response Logs and Azure OpenAI
      Request Usage
    switch_src: [1, 3]
    switch_quotes: [az-resource-default, az-categories]
    records: >-
      Records in the AzureDiagnostics table by category: Audit,
      AzureOpenAIRequestUsage, ManagedNetworkEvent, RequestResponse and Trace.
      Each carries the header fields common to all resource logs; anything
      specific to the service sits in properties, which no page read documents
      for these categories.
    records_src: [2, 4, 5, 14]
    full_field_list: null
    full_field_list_note: >-
      The header fields are documented; the properties member is not, for any
      of these categories. Source 5 sends the reader to source 2 for the
      schemas, and source 2 lists categories only. Source 4 links Foundry Tools
      to source 14, which carries no schema.
    full_record_kinds:
      src: [2, 1]
      quotes: [az-trace-cqa]
    fields:
      session.id:                    {v: U, src: [4], partial: "correlationId groups a set of related events, typically one operation's start and finish, not a session", note: "correlationId is an optional header field; nothing else could group a session."}
      session.start_time:            {v: A, form: derived, src: [4], note: "Derivable from a session's first record, given a session key."}
      session.user_id:               {v: U, src: [4], partial: "the identity that performed the operation, which is the calling application unless each user calls with their own identity", note: "identity is an optional header field."}
      session.tenant_id:             {v: A, form: caller, src: [4], note: "The deployment's own tenancy model; the header tenantId is the directory tenant, used for tenant-level logs only."}
      session.client_app:            {v: A, form: caller, src: [4], note: "Held only by the deployment; no page names a way to send it."}
      session.agent_id:              {v: A, form: caller, src: [4], note: "Held only by the deployment."}
      session.config_version:        {v: A, form: caller, src: [4], note: "Held only by the deployment."}
      turn.index:                    {v: A, form: derived, src: [4], note: "Derivable from record order within a session, given a session key."}
      turn.timestamp:                {v: D, src: [4], note: "time is a required header field: the timestamp of the event being logged."}
      turn.model_id:                 {v: U, src: [4, 2], note: "Would sit in properties, which is not documented."}
      turn.model_version:            {v: U, src: [4, 2], note: "As turn.model_id."}
      turn.tokens_in:                {v: U, src: [4, 2], note: "Neither RequestResponse nor AzureOpenAIRequestUsage has a documented field list."}
      turn.tokens_out:               {v: U, src: [4, 2], note: "As turn.tokens_in."}
      turn.latency:                  {v: U, src: [4, 1], partial: "the duration of the operation", note: "durationMs is an optional header field; the how-to's sample query reads it as request latency."}
      turn.finish_reason:            {v: U, src: [4, 2], note: "Would sit in properties, which is not documented."}
      content.prompt_text:           {v: U, src: [4, 2, 5], note: "Whether RequestResponse records carry a request body is not documented."}
      content.prompt_hash:           {v: A, form: derived, src: [4], note: "A hash the deployment computes from text."}
      content.response_text:         {v: U, src: [4, 2, 5], note: "As content.prompt_text."}
      content.response_hash:         {v: A, form: derived, src: [4], note: "A hash the deployment computes from text."}
      content.system_prompt_version: {v: A, form: caller, src: [4], note: "Held only by the deployment."}
      content.redaction_applied:     {v: A, form: caller, src: [4], note: "Held only by the deployment."}
      retrieval.document_ids:        {v: U, form: content, src: [4, 2], note: "Chunk identifiers, whose prefix is the document identifier, reach the model only inside tool results the lab writes; whether a body is logged is not settled."}
      retrieval.chunk_ids:           {v: U, form: content, src: [4, 2], note: "As retrieval.document_ids."}
      retrieval.scores:              {v: A, form: caller, src: [4], note: "The lab's search tool does not return scores to the model."}
      retrieval.query_text:          {v: U, src: [4, 2], note: "Would sit in the model's tool call inside a response body, which is not documented."}
      retrieval.source_provenance:   {v: A, form: derived, src: [4], note: "Derivable from document identifiers and the deployment's own provenance labels."}
      retrieval.permission_context:  {v: A, form: derived, src: [4], note: "Needs the caller's scope and each document's scope, which only the deployment holds."}
      action.tool_name:              {v: U, src: [4, 2], note: "Would sit in the model's tool call inside a response body, which is not documented."}
      action.tool_arguments:         {v: U, src: [4, 2], note: "As action.tool_name."}
