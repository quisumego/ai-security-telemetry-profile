# The figure ledger. Every figure SPEC.md, README.md and docs/write-up.md quote,
# with the committed file it comes from. Ruled at M8: spec/rulings.py, rulings 9
# and 10. Figures inside SPEC.md's generated blocks are written by spec/render.py
# and held by its own test, so they are not listed here.
#
#   quoted   the text exactly as the documents print it
#   in       the documents that print it
#   source   a committed result file: results/, the register, or siem/sentinel/
#   inputs   name: key path in the source (spec/ledger.py describes the form)
#   compute  name: a formula over the inputs, in the order given
#   render   the quoted text, built from the inputs and the computed values
#   check    a condition the source must meet for the quoted text to be true
#
# tests/test_spec.py resolves every entry, requires its render to equal its
# quoted text and its check to hold, and fails on any number in a published
# document that is neither here nor an identifier.

figures:

  # ------------------------------------------------------------- the register --
  - id: field-count
    quoted: "37 fields"
    in: [SPEC.md, README.md, docs/write-up.md]
    source: schema/fields.yaml
