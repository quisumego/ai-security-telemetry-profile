[project]
name = "ai-security-telemetry-profile"
version = "0.1.0"
description = "A security logging profile for LLM applications and agents, with the measurement that produced it."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# Needed from M1 onward, when the lab agent starts making model calls.
lab = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab", "attacks", "benign", "detect", "ablation", "cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
