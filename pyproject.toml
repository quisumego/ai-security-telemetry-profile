[project]
name = "ai-security-telemetry-profile"
version = "0.1.0"
description = "A security logging profile for LLM applications and agents, with the measurement that produced it."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# The lab agent runs on the Claude Agent SDK, which the agent, its three
# capture runners, the two cross-check reports and six test files load. The
# captures were taken with claude-agent-sdk 0.2.139; the bound is left open.
lab = [
    "claude-agent-sdk",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "lab",
    "lab.tools",
    "attacks",
    "benign",
    "detect",
    "ablation",
    "cost",
    "siem",
    "vendor_gap",
    "crosscheck",
    "spec",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
