title: Secret leaving to an unpermitted destination
id: d-a01
status: experimental
description: >-
  An outbound tool call carrying a tracked secret to a destination outside the
  deployment's permitted list. Destination and payload together: a tracked
  secret going to a permitted internal recipient is ordinary handover traffic
  and is not this rule.
references:
  - OWASP LLM01:2025
  - AML.T0051.000
author: Erebus
date: 2026/09/22
logsource:
  product: astp
  service: agent
detection:
  selection:
    event_type: tool_pre
    control.canary_triggered: true
  filter_permitted:
    action.egress_target|startswith:
      - 'mailto:'
    action.egress_target|endswith:
      - '@thornfieldmutual.invalid'
  condition: selection and not filter_permitted
falsepositives:
  - An internal handover quoting a claim's handling reference. Measured at one
    in one hundred benign sessions before the destination test was added.
level: high
